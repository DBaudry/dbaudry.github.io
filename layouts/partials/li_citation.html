<article class="pub-list-item">
  <h2 class="publication-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  <p class="publication-venue">{{ partial "publication_venue" . }}</p>
  <div class="publication-authors">{{ partial "publication_authors" . }}</div>
  <div class="btn-links">{{ partial "page_links" (dict "page" . "is_list" 1) }}</div>
</article>
