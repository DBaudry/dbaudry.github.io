<aside class="search-results" id="search" aria-label="Website search">
  <div class="container">
    <section class="search-header">

      <div class="row no-gutters justify-content-between mb-3">
        <div class="col-6">
          <h2>{{ i18n "search" }}</h2>
        </div>
        <div class="col-6 col-search-close">
          <button type="button" class="js-search search-close" aria-label="Close search"><i class="fas fa-times-circle text-muted" aria-hidden="true"></i></button>
        </div>
      </div>

      <div id="search-box">
        {{ if eq site.Params.search.engine 1 }}
        <input name="q" id="search-query" aria-label="Search the website" placeholder="{{i18n "search_placeholder"}}" autocapitalize="off"
        autocomplete="off" autocorrect="off" spellcheck="false" type="search" class="form-control">
        {{ else }}
        <!-- Search box will appear here -->
        {{ end }}
      </div>

    </section>
    <section class="section-search-results">

      <div id="search-hits" aria-live="polite">
        <!-- Search results will appear here -->
      </div>

    </section>
  </div>
</aside>
